<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes App - LocalStorage</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>📝 My Notes App</h1>
            <p class="subtitle">Keep track of your thoughts and ideas</p>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Input Section -->
            <section class="input-section">
                <div class="form-group">
                    <label for="noteTitle">Note Title</label>
                    <input 
                        type="text" 
                        id="noteTitle" 
                        placeholder="Enter note title..." 
                        maxlength="50"
                    >
                    <small class="char-count"><span id="titleCount">0</span>/50</small>
                </div>

                <div class="form-group">
                    <label for="noteContent">Note Content</label>
                    <textarea 
                        id="noteContent" 
                        placeholder="Write your note here..." 
                        rows="5"
                        maxlength="500"
                    ></textarea>
                    <small class="char-count"><span id="contentCount">0</span>/500</small>
                </div>

                <div class="button-group">
                    <button id="addBtn" class="btn btn-primary">
                        <span class="btn-icon">➕</span> Add Note
                    </button>
                    <button id="clearBtn" class="btn btn-secondary">
                        <span class="btn-icon">🗑️</span> Clear All
                    </button>
                </div>

                <div id="errorMessage" class="error-message"></div>
                <div id="successMessage" class="success-message"></div>
            </section>

            <!-- Search/Filter Section -->
            <section class="search-section">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="🔍 Search notes..." 
                    class="search-input"
                >
                <div class="filter-options">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="recent">Recent</button>
                    <button class="filter-btn" data-filter="oldest">Oldest</button>
                </div>
            </section>

            <!-- Stats Section -->
            <section class="stats-section">
                <div class="stat">
                    <span class="stat-label">Total Notes:</span>
                    <span class="stat-value" id="totalNotes">0</span>
                </div>
            </section>

            <!-- Notes Display Section -->
            <section class="notes-section">
                <div id="notesContainer" class="notes-container">
                    <div class="empty-state">
                        <p class="empty-icon">📭</p>
                        <p>No notes yet. Start by creating your first note!</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <h2>Edit Note</h2>
            
            <div class="form-group">
                <label for="editTitle">Note Title</label>
                <input 
                    type="text" 
                    id="editTitle" 
                    placeholder="Enter note title..." 
                    maxlength="50"
                >
                <small class="char-count"><span id="editTitleCount">0</span>/50</small>
            </div>

            <div class="form-group">
                <label for="editContent">Note Content</label>
                <textarea 
                    id="editContent" 
                    placeholder="Write your note here..." 
                    rows="5"
                    maxlength="500"
                ></textarea>
                <small class="char-count"><span id="editContentCount">0</span>/500</small>
            </div>

            <div class="modal-button-group">
                <button id="saveEditBtn" class="btn btn-primary">Save Changes</button>
                <button id="cancelEditBtn" class="btn btn-secondary">Cancel</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
